spring:
  application:
    name: habitparty-api-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

api:
  security:
    token:
      secret: test-jwt-secret-very-long-enough-for-hmac256-signing-test-key-32-chars

stripe:
  api:
    key: dummy_stripe_key
  webhook:
    secret: dummy_webhook_secret
  success:
    url: http://localhost:3000/dashboard?payment=success
  cancel:
    url: http://localhost:3000/dashboard?payment=cancel
  prices:
    monthly: dummy_monthly_price
    annual: dummy_annual_price

google:
  client:
    id: dummy_google_client_id
    secret: dummy_google_client_secret
    redirect-uri: http://localhost:3000/auth/callback

resend:
  api:
    key: dummy_resend_key
  from: HabitParty <onboarding@resend.dev>

app:
  frontend-url: http://localhost:3000
