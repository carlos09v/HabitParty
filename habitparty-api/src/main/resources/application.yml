spring:
  application:
    name: habitparty-api

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 300000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN

server:
  port: 8080

api:
  security:
    token:
      secret: ${JWT_SECRET}
      # https://randomkeygen.com/ ou `openssl rand -base64 32` (no terminal)

stripe:
  api:
    key: ${STRIPE_API_KEY:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}
  success:
    url: ${STRIPE_SUCCESS_URL:${APP_FRONTEND_URL:http://localhost:3000}/dashboard?payment=success&session_id={CHECKOUT_SESSION_ID}}
  cancel:
    url: ${STRIPE_CANCEL_URL:${APP_FRONTEND_URL:http://localhost:3000}/dashboard?payment=cancel}
  prices:
    monthly: ${STRIPE_MONTHLY_PRICE_ID:${STRIPE_PRICE_MONTHLY_ID:}}
    annual: ${STRIPE_ANNUAL_PRICE_ID:${STRIPE_PRICE_ANNUAL_ID:}}
    founder-annual: ${STRIPE_FOUNDER_ANNUAL_PRICE_ID:${STRIPE_PRICE_FOUNDER_ANNUAL_ID:}}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback}

resend:
  api:
    key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM_EMAIL:HabitParty <onboarding@resend.dev>}
  quota:
    monthly-limit: ${RESEND_MONTHLY_QUOTA:3000}
    reset-day: ${RESEND_QUOTA_RESET_DAY:16}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:uploads}

